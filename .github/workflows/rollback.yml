name: Rollback

# The one-command rollback: `gh workflow run rollback.yml -f sha=<short-sha>`.
# Redeploys a previously-built archive that deploy.yml already published as
# a GitHub Release (tag `deploy-<short-sha>`) — no rebuild, no dependency on
# whether that old commit still installs cleanly today. Find candidates
# with `gh release list --limit 20` (look for the `deploy-*` tags).
#
# This rolls back the *application code only*. It does not run, and cannot
# safely run, a database rollback — migrations are append-only (open-items.md
# #6; db/README.md); reversing a schema change means writing and deploying a
# new migration that undoes it, not un-applying the old one. If the commit
# you're rolling back to expected a column/table a later migration added,
# rolling back the app while that migration stays applied is exactly the
# forward/backward-compatible "expand" pattern this project already commits
# to for its migrations — confirm that's true for the specific migration
# before rolling back across it, rather than assuming.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Short SHA of the deploy to roll back to (see `gh release list` for deploy-* tags)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same gate as deploy.yml's release job: the Hostinger secrets live only in
    # the `production` environment, and a rollback is a production change, so
    # it waits for the same required reviewer (one click — you are the one
    # running it). Secrets are job-level, not workflow-level, because
    # environment secrets only reach jobs that name the environment.
    environment:
      name: production
    permissions:
      contents: read # download the deploy-<sha> release asset
      actions: read # read this environment's protection rules (first step)
    env:
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Refuse an unprotected production environment
        # See deploy.yml: GitHub silently creates a missing environment with
        # no protection, so the gate is checked rather than assumed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! reviewers="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
                --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')"; then
            echo "::error::Could not read the 'production' environment's protection rules. Refusing to roll back."
            exit 1
          fi
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "::error::The 'production' environment has no required reviewer (docs/deploy.md §3). Refusing to roll back."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Download the archived deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deploy
          gh release download "deploy-${{ inputs.sha }}" \
            --repo "${{ github.repository }}" \
            --pattern "truestock-deploy.zip" \
            --dir deploy --clobber

      - name: Deploy that archive to Hostinger
        id: deploy
        run: python3 scripts/hostinger-deploy-archive.py deploy/truestock-deploy.zip

      - name: Wait for the Hostinger build to finish
        run: python3 scripts/hostinger-poll-build.py "${{ steps.deploy.outputs.build_uuid }}"

      - name: Restart the Node.js process
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            "https://developers.hostinger.com/api/hosting/v1/accounts/${HOSTINGER_USERNAME}/websites/${HOSTINGER_DOMAIN}/nodejs/server/restart"
