name: CI

# Runs on every PR and every push (CLAUDE.md, "CI runs typecheck, lint, and
# tests on every push"). This is the gate deploy.yml depends on: nothing
# here means nothing gets shipped. Kept to a single job, no matrix, no
# extra Node install — bun does the whole thing (spec §11 explicitly
# endorses Bun for install *and* build/CI use; only the deployed, *running*
# process is Node).
on:
  # `push` is scoped to main deliberately. An unscoped `push:` alongside
  # `pull_request:` runs this whole workflow TWICE for every commit on a PR
  # branch — once for the push, once for the PR — and the concurrency group
  # below cannot collapse them, because the two events carry different
  # `github.ref` values (`refs/heads/<branch>` vs `refs/pull/<n>/merge`).
  # Observed on PR #1: two identical passing runs of the same commit.
  #
  # Split this way, a PR is gated by `pull_request` and main by `push` — every
  # commit still checked exactly once. The trade is that a branch pushed with
  # no PR open gets no CI, which is fine here: deploy.yml re-runs verify on
  # main before it ships anything.
  #
  # qa-release is listed too (2026-11-09, docs/branching.md): it is the
  # integration branch every feature lands on before a release, so a red
  # qa-release has to show up when the merge lands — not only later, on the
  # release PR into main.
  push:
    branches: [main, qa-release]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The test suite runs against a REAL database, deliberately. Every
    # invariant it covers — the count_line_write replay rollback, composite
    # tenant foreign keys, DECIMAL and JSON round-tripping — is enforced by the
    # database rather than by TypeScript, so a mocked test would only assert
    # that the mock works.
    #
    # MariaDB 11.8, matching both Hostinger (verified 2026-07-28,
    # 11.8.8-MariaDB) and docker-compose.yml. Pinned to the same minor so a CI
    # pass means the same thing a local pass does.
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: truestock_test
          MARIADB_USER: truestock
          MARIADB_PASSWORD: truestock
        ports:
          - 3306:3306
        # Same reasoning as docker-compose.yml: ping over TCP, not the socket,
        # because the entrypoint's temporary init server answers on the socket
        # and would report healthy before the real database exists.
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=40s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-migrations-immutable.sh diffs against origin/main; needs
          # real history, not the default single-commit shallow clone.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned, never `latest`: a green PR and a green deploy must run the
          # same toolchain, and it must match docker/app/Dockerfile's
          # BUN_VERSION (the owner's machine). Change all three together.
          bun-version: "1.4.0"

      - name: Cache Bun install + Next build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-bun-next-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-next-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        # Points at truestock_test, and the suite's own guard refuses to run
        # against any database whose name does not end in "_test" — it
        # truncates every table between files.
        #
        # The service container creates the database; the tests apply the
        # migration chain themselves, which means CI also proves the
        # migrations apply cleanly from empty on every run.
        env:
          DATABASE_URL: mysql://truestock:truestock@127.0.0.1:3306/truestock_test
        run: bun run test

      - name: Migrations are append-only
        # Against the PR's own base, not always main: a migration that has
        # already landed on qa-release is just as fixed as one on main — the
        # next feature PR must not edit it. A push has no base, so main.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bun run check:migrations-immutable "origin/${BASE_REF}"

      - name: Build
        # DATABASE_URL is never read at import time (db/index.ts is lazy —
        # see its own comment) specifically so a build never needs live
        # database credentials. No env vars are set for this step on
        # purpose; if the build ever starts requiring one, that's a
        # regression in db/index.ts's laziness, not something to patch
        # around here.
        run: bun run build

  # The browser gate. `verify` proves the server builds and the domain is
  # right; it cannot see the failure this project has shipped twice — a page
  # that renders, returns 200, and never hydrates (the static-CSP break of
  # 2026-07-28; AGENTS.md: "A 200 is not evidence that a page works"). This
  # job serves the PRODUCTION build and drives it in Chromium with the
  # full Playwright suite in two runs, desktop and emulated mobile. The smoke
  # spec is the core of it: the login form hydrates as a POST form, every
  # office page hydrates with no console or CSP errors, signed-out access
  # redirects.
  #
  # Mutation-checked 2026-11-08: with the nonce removed from script-src in
  # lib/csp.ts, global setup fails with `"form" never hydrated` and the job
  # exits 1; with it restored, 26/26 pass (mobile + desktop projects).
  #
  # It also runs the roles spec (2026-11-08): invariants 7 and 8 checked from
  # the outside — what the SERVER SENT each role (HTML plus the streamed RSC
  # payload), not what the screen shows. Staff and managers must receive no
  # cost data; the owner's catalog must (a positive control, so the negatives
  # cannot pass by being blind); the invoice-file route answers the owner 200,
  # a manager 403 and a signed-out request 401. Unit tests cover the role
  # predicates; only this sees a cost prop passed into a page for every role.
  #
  # Runs in parallel with `verify` (its own build, its own database), so it
  # adds wall-clock time only if it is the slower of the two. The job keeps the
  # name `e2e-smoke` because branch protection requires a check by that name;
  # renaming it would leave every PR waiting on a check that never reports.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          # Must end in `_e2e`: the suite refuses any other name
          # (e2e/support/guard.ts) because resetCounts() deletes every count.
          MARIADB_DATABASE: truestock_e2e
          MARIADB_USER: truestock
          MARIADB_PASSWORD: truestock
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=40s

    env:
      DATABASE_URL: mysql://truestock:truestock@127.0.0.1:3306/truestock_e2e
      E2E_BASE_URL: http://localhost:3101
      # E2E_ENV_FILE is set in the account step below, through $GITHUB_ENV. It
      # cannot live here: job-level `env` has no `runner` context, so a
      # runner.temp expression in this block makes GitHub reject the whole
      # workflow file — every job, `verify` included, silently never runs
      # (run #67, 2026-11-08: zero jobs, failed at creation).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0" # = verify job above and docker/app/Dockerfile

      - name: Cache Bun install, Next build cache, Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for the pinned Playwright (1.49.1)
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Migrate and seed the e2e database
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Create one throwaway account per role
        # Passwords are generated per run for a database that is destroyed with
        # the runner — nothing here is a secret worth storing. They are still
        # masked, and create-user is called through tsx directly because
        # `bun run` echoes the full command line, password included.
        run: |
          set -euo pipefail
          E2E_ENV_FILE="$RUNNER_TEMP/e2e.env"
          echo "E2E_ENV_FILE=$E2E_ENV_FILE" >> "$GITHUB_ENV"
          : > "$E2E_ENV_FILE"
          for role in owner manager staff; do
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            upper="$(echo "$role" | tr '[:lower:]' '[:upper:]')"
            printf 'E2E_%s_EMAIL=%s@example.test\nE2E_%s_PASSWORD=%s\n' "$upper" "$role" "$upper" "$pw" >> "$E2E_ENV_FILE"
            ./node_modules/.bin/tsx scripts/create-user.ts --email "$role@example.test" \
              --name "E2E $role" --org truestock --role "$role" --password "$pw"
          done

      - name: Seed one invoice with a stored file
        # So the roles spec's invoice-file checks run against a real invoice:
        # without one, the owner's 200 check can only skip as NOT VERIFIED.
        # The server and the suite both read INVOICE_STORAGE_DIR from here.
        run: |
          set -euo pipefail
          INVOICE_STORAGE_DIR="$RUNNER_TEMP/invoices"
          echo "INVOICE_STORAGE_DIR=$INVOICE_STORAGE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$INVOICE_STORAGE_DIR"
          INVOICE_STORAGE_DIR="$INVOICE_STORAGE_DIR" node scripts/e2e-seed-invoice.mjs

      - name: Production build
        run: bun run build

      - name: Serve the production build on 127.0.0.1:3101
        # The same `next start` the local rig uses (scripts/e2e-rig.sh prod).
        # The PID is kept and checked after readiness: a server that dies on
        # EADDRINUSE would otherwise leave the suite talking to whatever else
        # answers on the port.
        run: |
          set -euo pipefail
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          BETTER_AUTH_SECRET="$secret" \
          BETTER_AUTH_URL=http://localhost:3101 \
          NODE_ENV=production \
            nohup npx next start -p 3101 -H 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3101/login && break
            sleep 1
          done
          kill -0 "$(cat "$RUNNER_TEMP/server.pid")"
          curl -fsS -o /dev/null http://127.0.0.1:3101/login

      - name: Playwright desktop (every desktop spec)
        # GitHub sets CI=true, which makes global setup FAIL (not skip) if any
        # role cannot sign in — a pipeline cannot go green on skipped specs.
        # The whole `desktop` project, no spec list (2026-11-10): a new spec is
        # gated the day it lands instead of waiting for someone to add it here.
        # Which specs run where is decided once, by testIgnore in
        # playwright.config.ts (office-catalog and vendors-retire are desktop
        # only; the counting specs are mobile only).
        # Desktop and mobile are separate runs (as they are locally:
        # `bun run e2e:desktop` / `e2e:mobile`); each repeats global setup's
        # three sign-ins, well inside the rate limit.
        # Each run writes its own HTML report folder (the env var beats the
        # config's outputFolder), so the second run cannot overwrite the first's
        # evidence; the upload step below takes both.
        # The third project, `phone` (a real Android phone over CDP), never runs
        # here: it exists only when E2E_PHONE_CDP is set, which this job never
        # does, and `bun run e2e:phone` refuses to start under CI. It is a
        # development and QA run (docs/phone-count-test.md).
        id: e2e_desktop
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/desktop
        run: node node_modules/playwright/cli.js test --project=desktop

      - name: Playwright mobile (every mobile spec, emulated Pixel 7)
        # Runs whenever the desktop step ran, pass or fail, so a desktop failure
        # never hides the mobile result (and a server that never started skips
        # both).
        if: ${{ !cancelled() && (steps.e2e_desktop.outcome == 'success' || steps.e2e_desktop.outcome == 'failure') }}
        # The whole `mobile` project: smoke, roles, count-flow (the count write
        # path end to end, the offline-queue ordering, the Finish-section
        # warning and the pending-write Submit gate, open item #46) and
        # phone-round2 (the three 2026-10-25 phone-test regressions). The
        # counting specs reset every count before and after themselves, which
        # is safe on this throwaway database.
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/mobile
        run: node node_modules/playwright/cli.js test --project=mobile

      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
