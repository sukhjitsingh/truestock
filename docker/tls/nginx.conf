# TLS termination in front of the dev server, so a phone on the LAN gets a
# genuine secure context and the camera is available.
#
# Why this exists rather than the chrome://flags override: that flag is
# Chromium-only and per-device, and it silently does nothing on Firefox,
# Samsung Internet, or any browser that is not Chrome. HTTPS works everywhere,
# survives a browser change, and matches production's transport.
#
# The certificate is self-signed, so every browser shows a warning once. That
# is expected and is not a downgrade: accepting the warning still yields a
# real secure context — `isSecureContext` is true and getUserMedia is allowed.
# The warning is about identity, not about encryption.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A dev server streams RSC payloads and serves large first-load chunks over
    # a phone's wifi. Buffering them adds latency to exactly the screen whose
    # load time is being measured.
    proxy_buffering off;
    client_max_body_size 25m;

    # Docker's embedded DNS. Combined with the variable in proxy_pass below,
    # this forces nginx to re-resolve `app` at request time instead of once at
    # startup. It matters because scripts/dev-lan.sh RECREATES the app
    # container on every run, which gives it a new container IP — a cached
    # upstream would leave TLS 502-ing against an address that no longer
    # exists, while plain http on :3000 kept working. That asymmetry is
    # exactly the kind of thing that gets misread as "https is broken".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # The URI must be appended explicitly: when proxy_pass contains a
        # variable, nginx stops passing the request URI through on its own and
        # every request would arrive at the app as "/".
        set $upstream_app http://app:3000;
        proxy_pass $upstream_app$request_uri;
        proxy_http_version 1.1;

        # `$http_host`, NOT `$host`. $host drops the port, so Next would see
        # Host: 192.168.12.33 while the browser sends
        # Origin: https://192.168.12.33:3443 — and Next 16 rejects a Server
        # Action whose Origin and Host disagree. That failure reads as a
        # generic action error with nothing about ports in it.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Hot reload is a websocket. Without these it fails to upgrade, and
        # the symptom is edits silently not appearing rather than an error.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The HMR socket is idle for long stretches; the 60s default closes it
        # and the client reconnect-loops.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
